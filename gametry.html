<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Babi Babi Poyuyot</title>
<style>
:root{--bg:#ffe6f0;--sky2:#fff3e0;--ground:#ffb3d1;--ink:#6b3a55;--accent:#ff5fa2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1b33;--sky2:#3b2547;--ground:#5a3a70;--ink:#ffd9ec;--accent:#ff8cc0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1b33;--sky2:#3b2547;--ground:#5a3a70;--ink:#ffd9ec;--accent:#ff8cc0;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
let W,H,u,G,state='ready',best=0,score=0,t=0;
try{best=+localStorage.getItem('bunnyBest')||0}catch(e){}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);u=Math.max(34,Math.min(W,H)/11);G=H*0.78}
addEventListener('resize',resize);resize();
const P={y:0,vy:0,j:0,px:0};
let obs=[],clouds=[],hearts=[],nextGap=0;
for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:H*(0.1+Math.random()*0.35),s:u*(0.8+Math.random()*0.8),v:8+Math.random()*14});
function reset(){obs=[];hearts=[];score=0;P.y=G;P.vy=0;P.j=0;nextGap=W*0.9;state='play'}
function jump(){
  if(state!=='play'){if(state==='ready'||t>0.4)reset();return}
  if(P.j<2){P.vy=-H*1.12*(P.j?0.92:1);P.j++;for(let i=0;i<4;i++)hearts.push({x:P.px,y:P.y-u*0.4,vx:(Math.random()-0.5)*80,vy:-30-Math.random()*40,l:0.7})}
}
addEventListener('pointerdown',e=>{e.preventDefault();jump()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
function die(){state='over';t=0;if(score>best){best=Math.floor(score);try{localStorage.setItem('bunnyBest',best)}catch(e){}}}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;t+=dt;
  P.px=W*0.2;
  const speed=Math.max(260,W*0.45)+Math.min(score*3,260);
  clouds.forEach(k=>{k.x-=k.v*dt;if(k.x<-k.s*2){k.x=W+k.s;k.y=H*(0.1+Math.random()*0.35)}});
  if(state==='play'){
    score+=dt*10;
    P.vy+=H*3.3*dt;P.y+=P.vy*dt;
    if(P.y>=G){P.y=G;P.vy=0;P.j=0}
    nextGap-=speed*dt;
    if(nextGap<=0){const s=u*(0.9+Math.random()*0.5);obs.push({x:W+s,s,e:Math.random()<0.5?'\u{1F344}':'\u{1F335}'});nextGap=speed*(0.75+Math.random()*0.7)+u*2}
    obs.forEach(o=>o.x-=speed*dt);
    obs=obs.filter(o=>o.x>-o.s*2);
    for(const o of obs){
      const hw=(u*0.3+o.s*0.3),dx=Math.abs(o.x-P.px);
      if(dx<hw&&P.y>G-o.s*0.75){die();break}
    }
  }
  hearts.forEach(h=>{h.x+=h.vx*dt;h.y+=h.vy*dt;h.l-=dt});hearts=hearts.filter(h=>h.l>0);
  draw();requestAnimationFrame(loop);
}
function txt(s,px,py,size,col,w){x.font=`${w||'700'} ${size}px ${FONT}`;x.fillStyle=col;x.fillText(s,px,py)}
function draw(){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,css('--bg'));g.addColorStop(1,css('--sky2'));
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.textAlign='center';x.textBaseline='alphabetic';
  clouds.forEach(k=>{x.globalAlpha=0.7;txt('\u2601\uFE0F',k.x,k.y,k.s,css('--ink'));x.globalAlpha=1});
  x.fillStyle=css('--ground');x.fillRect(0,G,W,H-G);
  x.fillStyle=css('--accent');x.fillRect(0,G,W,4);
  const ink=css('--ink');
  obs.forEach(o=>txt(o.e,o.x,G+o.s*0.15,o.s,ink));
  hearts.forEach(h=>{x.globalAlpha=Math.max(0,h.l/0.7);txt('\u{1F496}',h.x,h.y,u*0.35,ink);x.globalAlpha=1});
  const y=state==='ready'?G+Math.sin(t*5)*-4:P.y;
  const sq=state==='play'&&P.y>=G?1:1.05;
  x.save();x.translate(P.px||W*0.2,y+u*0.15);x.rotate(state==='over'?-0.4:Math.max(-0.3,Math.min(0.3,P.vy/H*0.25)));
  x.scale(1/sq,sq);txt(state==='over'?'\u{1F635}':'\u{1F430}',0,0,u*1.2,ink);x.restore();
  const top=u*1.3;
  x.textAlign='center';
  if(state==='play'){x.textAlign='right';txt('\u2B50 '+Math.floor(score),W-16,top,u*0.6,ink);x.textAlign='left';txt('Best '+best,16,top,u*0.45,ink,'500');x.textAlign='center';txt('I love you Babi Babi Ko \u{1F496}',W/2,G+(H-G)*0.55,Math.min(u*0.7,W/17),ink)}
  x.textAlign='center';
  if(state==='ready'){txt('Babi Babi Poyuyot',W/2,H*0.28,Math.min(u*1.5,W/10.5),css('--accent'));txt('Tap to jump \u2014 tap again in the air to double jump!',W/2,H*0.28+u*1.1,Math.min(u*0.55,W/22),ink,'500');txt('Tap to start',W/2,H*0.5,u*0.8,ink)}
  if(state==='over'){txt('Oh no!',W/2,H*0.28,u*1.4,css('--accent'));txt('Score '+Math.floor(score)+'   Best '+best,W/2,H*0.28+u*1.1,u*0.7,ink);txt('Tap to try again',W/2,H*0.5,u*0.8,ink)}
}
requestAnimationFrame(loop);
</script>
</body>
</html>
